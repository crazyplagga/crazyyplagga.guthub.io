<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Secret Drops</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--gold1:#fff1a8;--gold2:#e0a91c;--gold3:#8c5a05;--ink:#fff8e7;--pink:#ff4f9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(90% 60% at 50% -5%,#7a2bb5,#2a0b3f 55%,#10031a);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;overflow:hidden}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:8px}
header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font:400 28px 'Lilita One',sans-serif;background:linear-gradient(#fff6c2,#f4b92a 55%,#b9780a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a1d00) drop-shadow(0 0 10px #ffb30088)}
.bal{background:linear-gradient(#000a,#000d);border:2px solid var(--gold2);border-radius:12px;padding:2px 12px;text-align:right;line-height:1.1;box-shadow:inset 0 0 10px #000}
.bal small{display:block;font-size:11px;color:var(--gold1);opacity:.8;font-weight:600}
.bal span{font-size:20px;font-weight:800;color:#fff}
#fsbar{display:none;width:100%;text-align:center;background:linear-gradient(90deg,#0000,#ff4f9a,#0000);font-weight:800;padding:2px 8px;letter-spacing:.5px}
.frame{position:relative;padding:12px;border-radius:26px;width:min(100%,calc((100dvh - 340px)*1.2));min-width:260px;background:linear-gradient(145deg,var(--gold1),var(--gold2) 35%,var(--gold3) 60%,#f6d86a);box-shadow:0 0 0 2px #4a2d00,0 12px 30px #000b,0 0 40px #ffb30055}
.frame::before{content:"";position:absolute;inset:3px;border-radius:23px;border:5px dotted #fffbe0;pointer-events:none;animation:bulb 1.2s steps(1) infinite}
@keyframes bulb{50%{border-color:#ff8a1f}}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;border-radius:14px;background:linear-gradient(#170529,#2f0d4f);box-shadow:inset 0 0 22px #000,inset 0 0 0 2px #0008}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8.4vw,38px);border-radius:12px;background:radial-gradient(circle at 30% 20%,#ffffff44,#ffffff0a 62%);border:1px solid #ffffff1f;box-shadow:inset 0 -4px 8px #0005;filter:drop-shadow(0 2px 2px #0008)}
.cell.drop{animation:drop .4s cubic-bezier(.3,1.4,.5,1) both}
.cell.pop{animation:pop .42s ease-in forwards;box-shadow:0 0 18px 4px #ffd84d}
.cell.b{background:radial-gradient(circle at 35% 25%,#fff3a0,#ff5a8a 70%);color:#fff;font:400 clamp(17px,5.6vw,24px) 'Lilita One';text-shadow:0 2px 0 #7a0030;border-color:#fff8}
.cell.x{background:radial-gradient(circle,#fff9,#7ef0c855 60%,#0000)}
@keyframes drop{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{50%{transform:scale(1.25);filter:brightness(1.7)}to{transform:scale(0);opacity:0}}
#win{min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;font:400 24px 'Lilita One';color:var(--gold1);text-shadow:0 2px 0 #4a1d00,0 0 14px #ffb300}
#win.big{font-size:34px;animation:pulse .6s ease 2}
@keyframes pulse{50%{transform:scale(1.12)}}
.panel{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px;border-radius:22px;background:linear-gradient(#1c0830,#0d0318);border:2px solid var(--gold2);box-shadow:inset 0 0 14px #000,0 0 20px #0008}
#buy{border:2px solid #ffd1e6;border-radius:14px;padding:6px 4px;background:linear-gradient(#ff7ab5,#c2185b);color:#fff;font:400 15px/1.1 'Lilita One';box-shadow:0 4px 0 #7a0a38,0 0 16px #ff4f9a88;text-shadow:0 1px 0 #5a0028}
#buy small{display:block;font:600 12px 'Baloo 2';opacity:.95}
#buy:active{transform:translateY(3px);box-shadow:0 1px 0 #7a0a38}
#buy:disabled{filter:grayscale(.8);opacity:.55}
#spin{width:92px;height:92px;border-radius:50%;border:5px solid var(--gold1);background:radial-gradient(circle at 35% 28%,#ffe27a,#e8a10f 60%,#a86a00);color:#3a1c00;font:400 24px 'Lilita One';box-shadow:0 6px 0 #6b4200,0 0 24px #ffb300aa;text-shadow:0 1px 0 #fff8}
#spin:active{transform:translateY(4px);box-shadow:0 2px 0 #6b4200}
#spin:disabled{filter:grayscale(.7);opacity:.65}
.bet{display:flex;flex-direction:column;align-items:center;line-height:1}
.bet small{font-size:11px;color:var(--gold1);opacity:.85}
.bet b{font:400 22px 'Lilita One';margin:2px 0}
.bet .r{display:flex;gap:8px}
.bet button{width:36px;height:30px;border-radius:9px;border:2px solid var(--gold2);background:#2a0b3f;color:var(--gold1);font:800 20px 'Baloo 2'}
#refill{display:none;border:0;border-radius:12px;padding:4px 14px;background:linear-gradient(#9ff6d8,#2fbf8f);color:#033;font:400 16px 'Lilita One'}
.note{font-size:11px;opacity:.55;text-align:center}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:9;padding:20px}
#modal.on{display:flex}
.card{width:100%;max-width:340px;text-align:center;padding:22px 18px;border-radius:24px;background:radial-gradient(circle at 50% 0,#7a2bb5,#240838);border:4px solid var(--gold2);box-shadow:0 0 40px #ffb300aa;animation:pulse .5s ease 1}
.card h2{margin:0 0 6px;font:400 30px 'Lilita One';color:var(--gold1);text-shadow:0 2px 0 #4a1d00}
.card p{margin:0 0 14px;font-size:17px}
.card button{margin:0 5px;border:0;border-radius:14px;padding:8px 20px;font:400 18px 'Lilita One';background:linear-gradient(#ffe27a,#e8a10f);color:#3a1c00}
.card button.alt{background:#ffffff22;color:#fff}
@media (prefers-reduced-motion:reduce){.cell.drop,.cell.pop,#win.big,.frame::before,.card{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Secret Drops</h1><div class="bal"><small>БАЛАНС</small><span id="bal">0</span></div></header>
  <div id="fsbar"></div>
  <div class="frame"><div id="board"></div></div>
  <div id="win">Собери 8+ одинаковых сладостей</div>
  <button id="refill">Получить +5 000 монет</button>
  <div class="panel">
    <button id="buy">КУПИТЬ БОНУС<small id="buycost"></small></button>
    <button id="spin">SPIN</button>
    <div class="bet"><small>СТАВКА</small><b id="bet">100</b><div class="r"><button id="minus" aria-label="Уменьшить ставку">−</button><button id="plus" aria-label="Увеличить ставку">+</button></div></div>
  </div>
  <div class="note">Игровые монеты, без реальных денег</div>
</div>
<div id="modal"><div class="card"><h2 id="mt"></h2><p id="ms"></p><div id="mb"></div></div></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#2a0b3f'); tg.setBackgroundColor('#10031a'); } catch(e){} }
const haptic = (t='light') => { try { tg.HapticFeedback.impactOccurred(t); } catch(e){} };

const COLS = 6, ROWS = 5, BETS = [20, 50, 100, 200, 500, 1000], BUY_X = 100;
const SYMS = [
  {e:'🍎', w:16, p:[0.2, 0.5, 1.5]},
  {e:'🍌', w:15, p:[0.25, 0.6, 1.8]},
  {e:'🍇', w:14, p:[0.3, 0.8, 2.5]},
  {e:'🍉', w:13, p:[0.4, 1, 3]},
  {e:'🍑', w:10, p:[0.6, 1.5, 5]},
  {e:'🍓', w:9,  p:[0.8, 2.5, 8]},
  {e:'🍬', w:7,  p:[1.5, 5, 20]},
  {e:'🍭', w:5,  p:[3, 10, 50]},
];
const BOMBS = [2,2,3,3,4,5,6,8,10,15,25];
const TOTAL_W = SYMS.reduce((a, s) => a + s.w, 0);

let bal = 10000, bet = 100, betIdx = 2, busy = false, cols = [];
let fs = 0, fsMult = 0, fsWin = 0, inFS = false;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Math.round(n).toLocaleString('ru-RU');

function rnd(initial) {
  const r = Math.random();
  if (r < 0.012) return {t:'b', v:BOMBS[Math.floor(Math.random()*BOMBS.length)], n:true};
  if (initial && r < 0.034) return {t:'x', n:true};
  let k = Math.random() * TOTAL_W, i = 0;
  while ((k -= SYMS[i].w) > 0) i++;
  return {t:'s', i, n:true};
}

function render(popSet) {
  const el = $('#board'); el.innerHTML = '';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = cols[c][r], d = document.createElement('div');
    d.className = 'cell';
    if (cell.t === 's') d.textContent = SYMS[cell.i].e;
    else if (cell.t === 'b') { d.classList.add('b'); d.textContent = '×' + cell.v; }
    else { d.classList.add('x'); d.textContent = '⭐'; }
    if (cell.n) { d.classList.add('drop'); d.style.animationDelay = (c * 30 + (ROWS - r) * 10) + 'ms'; cell.n = false; }
    if (popSet && cell.t === 's' && popSet.has(cell.i)) d.classList.add('pop');
    el.appendChild(d);
  }
}

function ui() {
  $('#bal').textContent = fmt(bal);
  $('#bet').textContent = fmt(bet);
  $('#buycost').textContent = '10 фриспинов · ' + fmt(bet * BUY_X);
  $('#refill').style.display = (!busy && bal < BETS[0] && fs === 0) ? 'block' : 'none';
  const f = $('#fsbar');
  f.style.display = (inFS || fs > 0) ? 'block' : 'none';
  f.textContent = `ФРИСПИНЫ: ${fs}` + (fsMult ? `  ·  МНОЖИТЕЛЬ ×${fsMult}` : '');
  $('#spin').disabled = busy;
  $('#buy').disabled = busy || fs > 0 || bal < bet * BUY_X;
  try { localStorage.setItem('cc_bal', bal); } catch(e){}
  try { tg.CloudStorage.setItem('bal', String(bal)); } catch(e){}
}

function say(text, big) {
  const w = $('#win'); w.textContent = text; w.classList.remove('big');
  if (big) { void w.offsetWidth; w.classList.add('big'); }
}

async function countWin(prefix, to) {
  const steps = 18;
  for (let i = 1; i <= steps; i++) { say(prefix + fmt(to * i / steps)); await sleep(30); }
}

function modal(title, sub, btns = [], auto = 0) {
  return new Promise(res => {
    $('#mt').textContent = title; $('#ms').innerHTML = sub;
    const b = $('#mb'); b.innerHTML = '';
    const close = v => { $('#modal').classList.remove('on'); res(v); };
    btns.forEach(x => {
      const el = document.createElement('button');
      el.textContent = x.t; if (x.alt) el.className = 'alt';
      el.onclick = () => close(x.v); b.appendChild(el);
    });
    $('#modal').classList.add('on');
    if (auto) setTimeout(() => close(true), auto);
  });
}

async function spin() {
  if (busy) return;
  const free = fs > 0;
  if (!free) { if (bal < bet) return; bal -= bet; inFS = false; fsMult = 0; fsWin = 0; }
  else { fs--; inFS = true; }
  busy = true; say('…'); ui(); haptic();

  cols = Array.from({length:COLS}, () => Array.from({length:ROWS}, () => rnd(true)));
  render();
  await sleep(750);

  let total = 0, step = 0;
  while (true) {
    const cnt = {};
    cols.flat().forEach(c => { if (c.t === 's') cnt[c.i] = (cnt[c.i] || 0) + 1; });
    if (step === 0) {
      const sc = cols.flat().filter(c => c.t === 'x').length;
      if (sc >= 4) {
        const add = inFS ? 5 : 10;
        total += bet * (sc === 4 ? 3 : sc === 5 ? 5 : 100);
        fs += add; inFS = true; ui(); haptic('heavy');
        await modal(`⭐ ${sc} ЗВЕЗД!`, `Бонус: +${add} фриспинов`, [], 2200);
      }
    }
    let win = 0; const kill = new Set();
    for (const i in cnt) {
      const n = cnt[i];
      if (n >= 8) { win += bet * SYMS[i].p[n >= 12 ? 2 : n >= 10 ? 1 : 0]; kill.add(+i); }
    }
    if (!kill.size) break;
    total += win; step++;
    say('+' + fmt(total)); haptic('medium');
    render(kill); await sleep(480);
    cols = cols.map(col => {
      const keep = col.filter(c => !(c.t === 's' && kill.has(c.i)));
      while (keep.length < ROWS) keep.unshift(rnd(false));
      return keep;
    });
    render(); await sleep(650);
  }

  let m = 0;
  if (total > 0) cols.flat().forEach(c => { if (c.t === 'b') m += c.v; });
  if (inFS) { fsMult += m; if (total > 0 && fsMult > 0) total *= fsMult; }
  else if (m > 0) total *= m;

  bal += total; fsWin += total;
  if (total > 0) {
    haptic(total >= bet * 10 ? 'heavy' : 'light');
    await countWin((m ? `×${inFS ? fsMult : m}  ` : '') + 'ВЫИГРЫШ ', total);
    if (total >= bet * 10) say(`ВЫИГРЫШ ${fmt(total)}`, true);
  } else say(inFS ? 'Без выигрыша' : 'Попробуй ещё!');

  busy = false;
  if (inFS && fs === 0) {
    ui();
    await modal('БОНУС ЗАВЕРШЁН', `Выиграно во фриспинах<br><b style="font-size:28px">${fmt(fsWin)}</b>`, [{t:'Забрать', v:true}]);
    inFS = false; fsMult = 0; fsWin = 0;
  }
  ui();
  if (fs > 0) { await sleep(900); spin(); }
}

async function buyBonus() {
  if (busy || fs > 0) return;
  const cost = bet * BUY_X;
  if (bal < cost) { say('Не хватает монет для бонуса'); return; }
  const ok = await modal('КУПИТЬ БОНУС?', `10 фриспинов, множители копятся<br>Цена: <b>${fmt(cost)}</b> монет`, [{t:'Купить', v:true}, {t:'Отмена', v:false, alt:true}]);
  if (!ok) return;
  bal -= cost; fs = 10; inFS = true; fsMult = 0; fsWin = 0; ui(); haptic('heavy');
  await modal('10 ФРИСПИНОВ', 'Удачи!', [], 1600);
  spin();
}

function setBet(d) {
  if (busy || fs > 0) return;
  betIdx = Math.max(0, Math.min(BETS.length - 1, betIdx + d)); bet = BETS[betIdx]; ui();
}

$('#spin').onclick = spin;
$('#buy').onclick = buyBonus;
$('#plus').onclick = () => setBet(1);
$('#minus').onclick = () => setBet(-1);
$('#refill').onclick = () => { bal += 5000; ui(); say('Бонус +5 000'); };

(function init() {
  cols = Array.from({length:COLS}, () => Array.from({length:ROWS}, () => { const c = rnd(false); return c.t === 's' ? c : {t:'s', i:0, n:true}; }));
  render(); ui();
  let local = null; try { local = localStorage.getItem('cc_bal'); } catch(e){}
  if (local !== null) { bal = +local || bal; ui(); }
  try { tg.CloudStorage.getItem('bal', (err, v) => { if (!err && v) { bal = +v; ui(); } }); } catch(e){}
})();
</script>
</body>
</html>
